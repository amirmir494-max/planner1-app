<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پلنر زندگی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f5fb; --card:#ffffff; --field:#f7f8fc; --ink:#1a2140; --muted:#67719a; --line:#e4e8f3; --line2:#cfd5e8;
  --brand:#5b5bf0; --brand2:#8b5cf6; --brand-soft:#ecebff;
  --ok:#16a34a; --ok-soft:#dcfce7; --warn:#f59e0b; --warn-soft:#fef3c7; --bad:#ef4444; --bad-soft:#fee2e2;
  --shadow:0 1px 2px rgba(20,30,70,.05),0 10px 28px rgba(20,30,70,.07);
  --hero:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#db2777 100%);
  --heroshadow:0 16px 40px rgba(91,70,230,.32);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1322; --card:#171e35; --field:#1d2542; --ink:#e9edfb; --muted:#9aa5cb; --line:#263052; --line2:#35406a;
    --brand:#8b8bff; --brand2:#a78bfa; --brand-soft:#262b57;
    --ok:#4ade80; --ok-soft:#153a27; --warn:#fbbf24; --warn-soft:#3d3113; --bad:#f87171; --bad-soft:#41202a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    --hero:linear-gradient(135deg,#3730a3 0%,#5b21b6 55%,#9d174d 100%);
    --heroshadow:0 16px 40px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1322; --card:#171e35; --field:#1d2542; --ink:#e9edfb; --muted:#9aa5cb; --line:#263052; --line2:#35406a;
  --brand:#8b8bff; --brand2:#a78bfa; --brand-soft:#262b57;
  --ok:#4ade80; --ok-soft:#153a27; --warn:#fbbf24; --warn-soft:#3d3113; --bad:#f87171; --bad-soft:#41202a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --hero:linear-gradient(135deg,#3730a3 0%,#5b21b6 55%,#9d174d 100%);
  --heroshadow:0 16px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:6px;background:var(--card);border-inline-end:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:0 10px 18px}
.logo i{font-style:normal;width:38px;height:38px;border-radius:13px;background:var(--hero);display:grid;place-items:center;font-size:20px;box-shadow:var(--heroshadow)}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:11px 12px;border-radius:14px;color:var(--muted);font-weight:600;text-align:start;transition:.15s}
.nav:hover{background:var(--field);color:var(--ink)}
.nav.on{background:var(--brand-soft);color:var(--brand)}
.ic svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
.main{padding:14px 20px 120px;max-width:1180px;width:100%;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 0 12px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top h1{font-size:22px;font-weight:800;flex:1}
.brand-m{display:none;font-size:22px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip.err{color:var(--bad);border-color:var(--bad)}
.iconbtn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px}
.iconbtn:hover{border-color:var(--brand)}
.tabbar{display:none;position:fixed;inset-inline:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .nav{flex-direction:column;gap:2px;padding:6px 2px;font-size:10.5px;justify-content:center;flex:1;text-align:center;border-radius:12px}
.tabbar .ic svg{width:23px;height:23px}
@media (max-width:900px){
  .app{display:block}.side{display:none}.tabbar{display:flex}
  .main{padding:8px 14px 110px}.brand-m{display:block}.top h1{font-size:19px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:16px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.pill .pp{margin-inline-start:8px;padding-inline-start:8px;border-inline-start:1px solid currentColor;opacity:.85}
.pill{background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:2px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:24px;font-weight:800;line-height:1.3}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.ok b{color:var(--ok)}.kpi.bad b{color:var(--bad)}.kpi.brand b{color:var(--brand)}
@media (max-width:900px){.cols,.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
/* hero */
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:22px;display:flex;align-items:center;gap:22px;position:relative;overflow:hidden;box-shadow:var(--heroshadow);margin-bottom:14px}
.hero::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.1);inset-inline-start:-70px;bottom:-90px;pointer-events:none}
.hero::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);inset-inline-end:-40px;top:-50px;pointer-events:none}
.hero-body{flex:1;min-width:0;position:relative;z-index:1}
.hero .greet{opacity:.9;font-size:14px}
.hero .date{font-size:24px;font-weight:800;line-height:1.35;margin:2px 0 8px}
.hero .msg{opacity:.95;font-size:14px;margin-bottom:12px}
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchips span{background:rgba(255,255,255,.18);border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:600;backdrop-filter:blur(4px)}
.dnav{display:inline-flex;align-items:center;gap:6px;margin-bottom:4px}
.dnav button{width:30px;height:30px;border-radius:10px;border:0;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;padding:0}
.dnav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dnav .today-btn{width:auto;padding:0 12px;font-size:12px;font-weight:700}
.hero .ringwrap{position:relative;z-index:1;flex:none}
@media (max-width:520px){.hero{flex-direction:column-reverse;align-items:stretch;text-align:center}.hero .ringwrap{align-self:center}.hchips{justify-content:center}.dnav{justify-content:center}.hero .date{font-size:21px}}
.ring{display:block}
.ring-bg{stroke:var(--ringbg,var(--line))}
.ring-fg{stroke:var(--ringc,var(--brand));transition:stroke-dashoffset .9s cubic-bezier(.3,.9,.3,1)}
.ring text{fill:var(--ringt,var(--ink));font-family:inherit;font-weight:800}
.hero .ring{--ringbg:rgba(255,255,255,.25);--ringc:#fff;--ringt:#fff}
/* week strip */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 2px 9px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wd small{color:var(--muted);font-size:11.5px}.wd b{font-size:16px;line-height:1.2}
.wd .mini{width:60%;height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:3px}
.wd .mini i{display:block;height:100%;background:var(--ok);border-radius:9px}
.wd.sel{border-color:var(--brand);background:var(--brand-soft)}
.wd.today b{color:var(--brand)}
/* forms */
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:13px;padding:10px 12px;width:100%;min-width:0;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
textarea{resize:vertical;min-height:70px;line-height:1.8}
input[type=range]{padding:0;height:26px;accent-color:var(--brand);background:transparent;border:0;box-shadow:none}
input[type=time]{width:112px;flex:none}
.btn{background:var(--brand);color:#fff;border:0;border-radius:13px;padding:10px 18px;font-weight:700;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.line{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}
.addrow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.addrow input[name=x]{flex:1;min-width:150px}
.starbtn{position:relative;flex:none}
.starbtn input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%}
.starbtn span{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--field);filter:grayscale(1);opacity:.6;transition:.15s;font-size:18px}
.starbtn input:checked+span{filter:none;opacity:1;background:var(--warn-soft);border-color:var(--warn)}
/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:15px;transition:.15s}
.task:hover{background:var(--field)}
.task .txt{flex:1;min-width:0;word-break:break-word}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.task .tm{font-size:12px;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:0 8px;font-weight:600}
.task .acts{display:flex;gap:2px;opacity:.55}.task:hover .acts{opacity:1}
.mini-btn{border:0;background:transparent;width:32px;height:32px;border-radius:10px;font-size:15px;display:grid;place-items:center}
.mini-btn:hover{background:var(--line)}
.mini-btn.star.on{filter:none}.mini-btn.star{filter:grayscale(1);opacity:.5}.mini-btn.star.on{opacity:1}
.chk{position:relative;display:inline-block;width:26px;height:26px;flex:none}
.chk input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
.chk span{position:absolute;inset:0;border:2px solid var(--line2);border-radius:9px;background:var(--card);transition:.2s}
.chk span::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);transition:.2s}
.chk input:checked+span{background:var(--chkc,var(--ok));border-color:var(--chkc,var(--ok))}
.chk input:checked+span::after{transform:rotate(45deg) scale(1)}
.chk input:focus-visible+span{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent)}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .7s cubic-bezier(.3,.9,.3,1)}
.bar.ok>i{background:linear-gradient(90deg,#22c55e,#16a34a)}.bar.bad>i{background:linear-gradient(90deg,#f97316,var(--bad))}.bar.warn>i{background:linear-gradient(90deg,#fbbf24,var(--warn))}
.bar.tight{margin:4px 0 0;height:7px}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
.empty b{display:block;font-size:26px;margin-bottom:4px}
.rowacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.habit-row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;cursor:pointer}
.habit-row:hover{background:var(--field)}
.habit-row .emo{font-size:20px}.habit-row .hn{flex:1;min-width:0}.habit-row .fire{font-size:12.5px;color:var(--warn);font-weight:700}
/* health */
.glasses{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px}
.gl{border:0;background:transparent;font-size:24px;padding:2px 3px;filter:grayscale(1);opacity:.28;transition:.15s;border-radius:10px}
.gl.on{filter:none;opacity:1;transform:scale(1.05)}
.gl:hover{background:var(--field)}
.hrow{padding:10px 0;border-top:1px dashed var(--line)}
.hrow:first-of-type{border-top:0;padding-top:0}
.hrow .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.hrow .lbl small{color:var(--muted);font-weight:500}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border-radius:11px;border:1px solid var(--line2);background:var(--field);font-size:18px;line-height:1;font-weight:700;padding:0}
.step button:hover{border-color:var(--brand);color:var(--brand)}
.step b{min-width:82px;text-align:center;font-weight:700}
.moods{display:flex;gap:6px;justify-content:space-between;margin-top:4px}
.moods button{flex:1;border:1px solid var(--line);background:var(--field);border-radius:14px;font-size:24px;padding:4px 0;filter:grayscale(.9);opacity:.7;transition:.15s}
.moods button.on{filter:none;opacity:1;border-color:var(--brand);background:var(--brand-soft);transform:translateY(-2px)}
/* lists */
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .em{font-size:20px;width:34px;height:34px;border-radius:12px;background:var(--field);display:grid;place-items:center;flex:none}
.li .grow{flex:1;min-width:0}.li .grow small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.amt{font-weight:800;white-space:nowrap}.amt.in{color:var(--ok)}.amt.out{color:var(--ink)}
.dayhead{font-size:12.5px;color:var(--muted);font-weight:700;padding:10px 4px 2px}
/* calendar */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:6px 18px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
.mnav .t{font-size:19px;font-weight:800;text-align:center;flex:1}
.mnav button.nb{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.mnav button.nb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.cal{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:2px 0}
.cell{aspect-ratio:1/1;border-radius:16px;border:1px solid var(--line);background:var(--card);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;overflow:hidden;transition:.15s}
.cell::before{content:"";position:absolute;inset:0;background:var(--heat,transparent)}
.cell>*{position:relative}
.cell b{font-size:15px}.cell small{font-size:10.5px;color:var(--muted)}
.cell:hover{transform:translateY(-2px);border-color:var(--brand)}
.cell.today{border:2px solid var(--brand)}
.cell.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent)}
.cell.blank{visibility:hidden}
.legend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{width:16px;height:16px;border-radius:6px;display:inline-block}
.wcard{padding:14px}
.wcard .wh{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.wcard .wh .tt{flex:1}.wcard .wh b{display:block;font-size:16px}
.wcard.today{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 25%,transparent),var(--shadow)}
.tiny-task{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px}
.tiny-task .chk{width:22px;height:22px}.tiny-task .chk span::after{left:6px;top:1px;width:6px;height:11px}
.tiny-task.done span.tx{text-decoration:line-through;color:var(--muted)}
/* habits grid */
.scrollx{overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.hgrid{border-collapse:separate;border-spacing:3px;min-width:100%}
.hgrid th{font-size:11px;color:var(--muted);font-weight:600;padding:0 0 4px;min-width:22px}
.hgrid th.today{color:var(--brand);font-weight:800}
.hgrid td.nm{position:sticky;inset-inline-start:0;background:var(--card);z-index:2;white-space:nowrap;padding-inline-end:12px;font-weight:600;font-size:14px}
.hgrid td.pc{font-size:12.5px;font-weight:800;padding-inline-start:8px;color:var(--muted)}
.hc{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);background:var(--field);padding:0;transition:.12s;display:block}
.hc.on{background:var(--hcol);border-color:var(--hcol)}
.hc.fut{opacity:.35}
.hc:hover{transform:scale(1.15)}
.hbar{display:flex;align-items:center;gap:10px;margin:8px 0}
.hbar .n{width:38%;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .bar{flex:1;margin:0}.hbar .v{width:44px;font-size:13px;font-weight:800;text-align:end}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:inherit;fill:var(--muted);font-size:12px}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .tgt{stroke:var(--warn);stroke-width:1.4;stroke-dasharray:4 3}
.chart .cbar{rx:3}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.donut{width:170px;height:170px;flex:none}
.donut text{font-family:inherit}
.dleg{flex:1;min-width:180px}
.dleg div{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:2px 0}
.dleg i{width:12px;height:12px;border-radius:4px;flex:none}
.dleg span{flex:1}.dleg b{font-weight:700}
.moodstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:4px}
.moodstrip div{text-align:center;font-size:18px;background:var(--field);border-radius:9px;padding:1px 0;position:relative}
.moodstrip div small{display:block;font-size:9px;color:var(--muted);line-height:1}
.grade{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.grade .gt{flex:1;min-width:200px}
.grade .gt h2{font-size:22px;font-weight:800}
.delta{font-size:12.5px;font-weight:700;border-radius:99px;padding:2px 10px;display:inline-block}
.delta.up{background:var(--ok-soft);color:var(--ok)}.delta.down{background:var(--bad-soft);color:var(--bad)}.delta.eq{background:var(--field);color:var(--muted)}
.insight{display:flex;gap:12px;padding:10px 12px;border-radius:14px;background:var(--field);margin-bottom:8px;align-items:flex-start}
.insight .ii{font-size:20px;line-height:1.5}

const LS={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}},
  keys(){try{return Object.keys(localStorage)}catch(e){return[]}}
};
function loadLocal(){
  LS.keys().filter(k=>k.startsWith(P)).forEach(k=>{
    try{const id=k.slice(P.length),o=JSON.parse(LS.get(k));if(o&&typeof o==='object')setDoc(id,o)}catch(e){}
  });
}
const allIds=()=>['settings',...Object.keys(S.months)].filter(id=>getDoc(id)&&getDoc(id)._t);
function setStatus(kind){
  const el=$('#status');if(!el)return;
  const map={saving:'⏳ در حال ذخیره…',cloud:'☁️ ذخیره شد',local:'💾 ذخیره در این مرورگر',err:'⚠️ ذخیره‌ی ابری ناموفق (محلی ذخیره شد)'};
  el.textContent=map[kind]||'';el.classList.toggle('err',kind==='err');
}
function touch(id){const d=getDoc(id);if(!d)return;d._t=Date.now();ST.dirty.add(id);setStatus('saving');schedule(600)}
function schedule(ms){clearTimeout(ST.timer);ST.timer=setTimeout(flush,ms)}
async function flush(){
  if(ST.flushing){schedule(300);return}
  ST.flushing=true;let bad=false;
  try{
    while(ST.dirty.size){
      const id=[...ST.dirty][0];ST.dirty.delete(id);const d=getDoc(id);if(!d)continue;
      const body=JSON.stringify(d);LS.set(P+id,body);
      if(ST.mode==='cloud'){
        try{await ST.col.doc(id).set(JSON.parse(body))}
        catch(e){bad=true;ST.failed.add(id)}
      }
    }
  }finally{ST.flushing=false}
  if(ST.mode==='cloud'){
    if(bad||ST.failed.size){setStatus('err');setTimeout(()=>{ST.failed.forEach(i=>ST.dirty.add(i));ST.failed.clear();schedule(0)},15000)}
    else setStatus('cloud');
  }else setStatus('local');
}
async function pullCloud(){
  const snap=await ST.col.get();const remote={};
  snap.docs.forEach(d=>{remote[d.id]=JSON.parse(JSON.stringify(d.data()))});
  let changed=false;
  for(const id in remote){
    if(ST.dirty.has(id))continue;
    const r=remote[id],l=getDoc(id);
    if(!l||!l._t||(r._t||0)>=(l._t||0)){
      if(!l||JSON.stringify(l)!==JSON.stringify(r)){setDoc(id,r);LS.set(P+id,JSON.stringify(r));changed=true}
    }else ST.dirty.add(id);
  }
  allIds().forEach(id=>{if(!(id in remote))ST.dirty.add(id)});
  if(ST.dirty.size)schedule(0);
  return changed;
}
async function initStore(){
  loadLocal();applyTheme();postLoad();render();setStatus('local');
  try{
    if(!window.claude||typeof window.claude.use!=='function')throw 0;
    const[user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(!user||!db)throw 0;
    const id=await user.id();if(!id)throw 0;
    ST.col=db.collection('data/users/'+id);ST.mode='cloud';
    const ch=await pullCloud();setStatus('cloud');
    if(ch){applyTheme();postLoad();render()}
  }catch(e){ST.mode='local';setStatus('local')}
  try{window.claude&&window.claude.use&&window.claude.use('downloads').then(d=>{ST.dl=d}).catch(()=>{})}catch(e){}
}
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden){if(ST.dirty.size)flush();return}
  if(ST.mode==='cloud'&&!ST.dirty.size){
    try{const ch=await pullCloud();const a=document.activeElement;
      if(ch&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&!$('#modal').classList.contains('open')){applyTheme();render()}}catch(e){}
  }
});
window.addEventListener('pagehide',()=>{if(ST.dirty.size)flush()});

function ring(pct,size=120,sw=11,key=''){
  const r=(size-sw)/2,c=2*Math.PI*r,prev=key?(S.prev[key]||0):0;if(key)S.prev[key]=pct;
  const off=c*(1-pct/100),off0=c*(1-prev/100),h=size/2;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" data-off="${off}" role="img" aria-label="${fa(pct)} درصد">
  <circle class="ring-bg" cx="${h}" cy="${h}" r="${r}" fill="none" stroke-width="${sw}"/>
  <circle class="ring-fg" cx="${h}" cy="${h}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off0}" transform="rotate(-90 ${h} ${h})"/>
  <text x="${h}" y="${h+size*0.09}" text-anchor="middle" font-size="${size*0.27}">${fa(pct)}٪</text></svg>`;
}
const heat=p=>`hsl(${Math.round(p*1.25)} 72% 50% / ${(0.16+0.5*p/100).toFixed(2)})`;
const heatSolid=p=>`hsl(${Math.round(p*1.25)} 70% 48%)`;
function barChart(vals,{max=100,h=150,every=5,fmt=v=>fa(v)+'٪'}={}){
  const W=620,n=vals.length,bw=W/n,base=h-22;let s='';
  [0,50,100].forEach(g=>{const y=base-(g/100)*(base-8);s+=`<line class="gridl" x1="0" x2="${W}" y1="${y}" y2="${y}"/><text x="${W-2}" y="${y-2}" text-anchor="end">${fa(Math.round(g/100*max))}</text>`});
  vals.forEach((v,i)=>{
    const x=W-(i+1)*bw+bw*.16,w=bw*.68;
    if(v==null){s+=`<rect class="cbar" x="${x}" y="${base-2}" width="${w}" height="2" style="fill:var(--line2)"/>`}
    else{const bh=Math.max(2,(v/max)*(base-8));s+=`<rect class="cbar" x="${x}" y="${base-bh}" width="${w}" height="${bh}" style="fill:${heatSolid(v/max*100)}"><title>${fa(i+1)}: ${fmt(v)}</title></rect>`}
    if((i+1)%every===0||i===0)s+=`<text x="${x+w/2}" y="${h-6}" text-anchor="middle">${fa(i+1)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
}
function lineChart(vals,{min=0,max=10,target=null,h=140,every=5}={}){
  const W=620,n=vals.length,bw=W/n,base=h-22,top=10;const y=v=>base-((v-min)/(max-min))*(base-top);
  let s='';[min,(min+max)/2,max].forEach(g=>{s+=`<line class="gridl" x1="0" x2="${W}" y1="${y(g)}" y2="${y(g)}"/><text x="${W-2}" y="${y(g)-2}" text-anchor="end">${fa(g)}</text>`});
  if(target!=null)s+=`<line class="tgt" x1="0" x2="${W}" y1="${y(target)}" y2="${y(target)}"/>`;
  let pts=[];vals.forEach((v,i)=>{if(v!=null)pts.push([W-(i+.5)*bw,y(v),i])});
  if(pts.length>1)s+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" style="stroke:var(--brand)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(p=>{s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4" style="fill:var(--brand)"><title>${fa(p[2]+1)}: ${dec(vals[p[2]])}</title></circle>`});
  for(let i=0;i<n;i++)if((i+1)%every===0||i===0)s+=`<text x="${W-(i+.5)*bw}" y="${h-6}" text-anchor="middle">${fa(i+1)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${h}">${s}</svg>`;
}
function donut(items,total,label,valTxt){
  let cum=0,segs='';
  items.forEach((it,i)=>{const p=total?it.v/total*100:0;segs+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-cum}"/>`;cum+=p});
  return `<svg class="donut" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" style="stroke:var(--line)" stroke-width="6"/>${segs}<text x="21" y="20.2" text-anchor="middle" font-size="3" style="fill:var(--muted)">${label||'جمع هزینه'}</text><text x="21" y="25" text-anchor="middle" font-size="3.6" font-weight="800" style="fill:var(--ink)">${valTxt||compact(total)}</text></svg>`;
}
function compact(n){if(n>=1e9)return fa((Math.round(n/1e8)/10).toString().replace('.','٫'))+' میلیارد';if(n>=1e6)return fa((Math.round(n/1e5)/10).toString().replace('.','٫'))+' میلیون';if(n>=1e3)return fa(Math.round(n/1e3))+' هزار';return fa(Math.round(n))}
function radar(vals){
  const cx=160,cy=128,R=84,n=WHEEL.length;let s='';
  const pt=(i,v)=>{const a=-Math.PI/2-i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/10,cy+Math.sin(a)*R*v/10]};
  [2,4,6,8,10].forEach(g=>{s+=`<polygon points="${WHEEL.map((_,i)=>pt(i,g).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" class="gridl"/>`});
  WHEEL.forEach((w,i)=>{const[x,y]=pt(i,10),[lx,ly]=pt(i,12.3);s+=`<line class="gridl" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle" font-size="10.5" style="fill:var(--ink)">${w[1]}</text>`});
  s+=`<polygon points="${WHEEL.map((w,i)=>pt(i,vals[w[0]]||0).map(x=>x.toFixed(1)).join(',')).join(' ')}" style="fill:color-mix(in srgb,var(--brand) 30%,transparent);stroke:var(--brand)" stroke-width="2.2" stroke-linejoin="round"/>`;
  WHEEL.forEach((w,i)=>{const[x,y]=pt(i,vals[w[0]]||0);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" style="fill:var(--brand)"/>`});
  return `<svg class="chart" viewBox="0 0 320 256" style="max-width:420px;margin:auto">${s}</svg>`;
}

function repYear(){

  const grade=!Y.active?['—','هنوز داده‌ای برای این سال نیست']:Y.avg>=85?['🏆','سالی عالی']:Y.avg>=70?['🌟','سالی خیلی خوب']:Y.avg>=50?['👍','سالی خوب']:['🌱','سال ساختن عادت‌ها'];
  const act=Y.M.filter(x=>x.active),bestM=act.length?act.reduce((a,b)=>b.avg>a.avg?b:a):null,worstM=act.length>1?act.reduce((a,b)=>b.avg<a.avg?b:a):null;

  const payKeys=Object.keys(Y.byPay).sort((a,b)=>Y.byPay[b]-Y.byPay[a]).slice(0,3),pcol=['#6366f1','#22c55e','#f59e0b'];

  const cmpRows=[['میانگین پیشرفت (٪)',Y.avg,P.avg,0],['کار انجام‌شده',Y.td,P.td,0],['تمرکز (ساعت)',Math.round(Y.focus/60),Math.round(P.focus/60),0],['درآمد',Y.inc,P.inc,0],['هزینه',Y.exp,P.exp,1],['پس‌انداز',save,P.inc-P.exp,0]];

   <section class="card"><div class="card-h"><h3>🎯 تمرکز هر ماه (ساعت)</h3></div>${Y.focus?bars(Y.M.map(x=>Math.round(x.focus/6)/10),{labels:lab,every:1,color:()=>'var(--brand2)',fmt:v=>dec(v),axis:v=>dec(v)}):'<div class="empty">تمرکزی ثبت نشده.</div>'}</section>

function modal(html){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.classList.add('open')}
function closeModal(){const m=$('#modal');m.classList.remove('open');m.innerHTML='';ALARM=[]}
let toastT;function toast(msg){const t=$('#toast');t.innerHTML=`<div>${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>t.innerHTML='',2200)}
function confetti(){const em=['🎉','✨','🌟','💫','🎊','🌿'];for(let i=0;i<28;i++){const s=document.createElement('span');s.className='conf';s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=(Math.random()*.6)+'s';s.style.fontSize=(18+Math.random()*16)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),3000)}}
function applyTheme(){const t=S.settings.theme,r=document.documentElement;if(t==='dark'||t==='light')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme')}
function saveFile(name,data){
  if(window.Android&&Android.saveFile){let ok=false;try{ok=Android.saveFile(name,data)}catch(e){}toast(ok?(name.endsWith('.ics')?'فایل تقویم ساخته شد؛ در تقویم باز کن':'فایل در پوشه‌ی Downloads ذخیره شد ✅'):'ذخیره‌ی فایل ناموفق بود');return}
  if(ST.dl){ST.dl.save({filename:name,data}).then(()=>toast('فایل ذخیره شد ✅')).catch(e=>{if(e&&e.code!=='declined')fileFallback(name,data)});return}
  try{const type=name.endsWith('.csv')?'text/csv;charset=utf-8':name.endsWith('.ics')?'text/calendar;charset=utf-8':'application/json',b=new Blob([data],{type}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('دانلود شروع شد ⬇')}
  catch(e){fileFallback(name,data)}
}
function fileFallback(name,data){modal(`<h3>${esc(name)}</h3><p class="sub" style="margin-bottom:8px">دانلود مستقیم در این محیط ممکن نیست. متن زیر را کپی کن و در یک فایل ذخیره کن.</p><textarea style="min-height:180px;direction:ltr;text-align:left" readonly>${esc(data)}</textarea><div class="foot"><button class="btn" data-act="closeModal">بستن</button></div>`)}

  if(levelOf(xa)>levelOf(xb)){confetti();toast('🚀 سطح '+fa(levelOf(xa))+': '+levelName(levelOf(xa)))}}

    if(v==null||v===0){s+=`<rect x="${x}" y="${base-2}" width="${w}" height="2" rx="1" style="fill:var(--line2)"/>`}

/* ---------- XP، انضباط، نشان‌ها ---------- */
const taskXP=t=>10+(t.imp?5:0)+Math.min(20,Math.round((t.du||0)/15));
function dayXP(day){const s=dayStats(day);let x=0;(day.t||[]).forEach(t=>{if(t.done)x+=taskXP(t)});x+=s.hd*5+Math.min(240,focusMin(day));if(s.tt>=3&&s.pct===100)x+=20;return x}
function totalXP(){let x=0;for(const id in S.months){const md=S.months[id];for(const d in md.days)x+=dayXP(md.days[d])}return x}
const levelOf=xp=>Math.floor(Math.sqrt(xp/60))+1;
const LVN=['تازه‌کار','مصمم','منظم','پیگیر','حرفه‌ای','استاد انضباط','افسانه'];
const levelName=l=>LVN[Math.min(LVN.length-1,Math.floor((l-1)/2))];
function discScore(day){
  const s=dayStats(day),g=S.settings,c=[];
  if(s.tt)c.push([s.tpct,40]);
  if(s.ht&&(s.hd>0||s.tt))c.push([Math.round(s.hd/s.ht*100),25]);
  const fm=focusMin(day);if(fm>0)c.push([Math.min(100,fm/g.focus.goal*100),20]);
  const hv=[[day.w,g.goal.w],[day.sl,g.goal.sl],[day.ex,g.goal.ex],[day.st,g.goal.st]].filter(x=>x[0]>0);
  if(hv.length)c.push([avg(hv.map(x=>Math.min(100,x[0]/x[1]*100))),15]);
  if(!c.length)return null;
  return Math.round(c.reduce((a,x)=>a+x[0]*x[1],0)/c.reduce((a,x)=>a+x[1],0));
}
function discStreak(){const th=S.settings.disc.th,ok=j=>{const v=discScore(dget(j));return v!=null&&v>=th};let j=todayJ(),n=0;if(!ok(j))j=addDays(j,-1);for(let i=0;i<730;i++){if(ok(j)){n++;j=addDays(j,-1)}else break}return n}
function discBest(){let b=0,r=0;const t=todayJ(),th=S.settings.disc.th;for(let i=400;i>=0;i--){const v=discScore(dget(addDays(t,-i)));if(v!=null&&v>=th){r++;b=Math.max(b,r)}else r=0}return b}
function lifetime(){const L={done:0,total:0,focus:0,perfect:0,days:0,saveM:0};for(const id in S.months){const md=S.months[id];for(const d in md.days){const day=md.days[d],s=dayStats(day);L.done+=s.td;L.total+=s.tt;L.focus+=focusMin(day);if(s.tt>=3&&s.pct===100)L.perfect++;if(s.active)L.days++}
  let inc=0,exp=0;md.inc.forEach(i=>inc+=i.a);md.exp.forEach(e=>exp+=e.a);if(inc>0&&(inc-exp)/inc>=.2)L.saveM++}return L}
function goalStats(g){let td=0,tt=0,sp=0;allTasks(t=>{if(t.gl===g.id){tt++;if(t.done)td++;sp+=t.sp||0}});const ms=g.ms||[],md=ms.filter(x=>x.done).length;
  return{td,tt,sp,md,mt:ms.length,pct:ms.length?Math.round(md/ms.length*100):tt?Math.round(td/tt*100):0}}
function badges(){const L=lifetime(),lv=levelOf(totalXP()),best=discBest(),hs=Math.max(0,...S.settings.habits.map(h=>streak(h.id))),gd=S.settings.goals.filter(g=>goalStats(g).pct>=100).length;

   {e:'🌱',n:'اولین قدم',d:'اولین کارت را انجام بده',c:L.done,t:1},

let ALARM=[];
function trig(t,j){if(!t.tm||!hasRem(t))return null;return t.sz||gDate(j,t.tm).getTime()-(+t.rm)*60000}
function checkReminders(){
  if(!S.settings.notif.on)return;
  const now=Date.now(),t0=todayJ(),due=[];
  for(let k=-1;k<=2;k++){const j=addDays(t0,k);(dget(j).t||[]).forEach(t=>{if(t.done||t.rf)return;const tr=trig(t,j);if(tr!=null&&now>=tr&&now-tr<864e5)due.push({t,j})})}
  if(!due.length)return;
  due.forEach(x=>{x.t.rf=now;x.t.sz=0;touch(mid(x.j.y,x.j.m))});
  beep(3);due.forEach(x=>notify('⏰ '+x.t.x,fullDate(x.j)+' — ساعت '+fa(x.t.tm),x.t.id));
  if($('#modal').classList.contains('open')){toast('⏰ یادآوری: '+due[0].t.x+(due.length>1?' و '+fa(due.length-1)+' مورد دیگر':''));return}
  ALARM=ALARM.concat(due);renderAlarm();
}
function renderAlarm(){
  if(!ALARM.length){closeModal();return}
  modal(`<h3>⏰ یادآوری</h3>${ALARM.map(x=>`<div class="alarm-item"><b>${esc(x.t.x)}</b><div class="sub">${fullDate(x.j)} — ساعت ${fa(x.t.tm)}${x.t.du?' · '+fmtMin(x.t.du):''}</div>${x.t.nt?`<div class="sub">${esc(x.t.nt)}</div>`:''}
   <div class="rowacts"><button class="btn sm" data-act="alarmDone" data-id="${x.t.id}" data-date="${dk(x.j)}">✅ انجام شد</button><button class="btn ghost sm" data-act="alarmSnooze" data-id="${x.t.id}" data-date="${dk(x.j)}">⏱ ۱۰ دقیقه بعد</button><button class="btn line sm" data-act="alarmFocus" data-id="${x.t.id}" data-date="${dk(x.j)}">🎯 شروع تمرکز</button></div></div>`).join('')}<div class="foot"><button class="btn line" data-act="alarmClose">بستن</button></div>`);
}
function upcoming(days){const t0=todayJ(),out=[],nw=Date.now();for(let i=0;i<=days;i++){const j=addDays(t0,i);(dget(j).t||[]).forEach(t=>{if(!t.done&&t.tm&&(i>0||gDate(j,t.tm).getTime()>=nw-3600e3))out.push({t,j})})}return out.sort((a,b)=>gDate(a.j,a.t.tm)-gDate(b.j,b.t.tm))}
function makeICS(list){
  const st=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',ic=s=>String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'),f=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LifePlanner//FA//EN','CALSCALE:GREGORIAN'];
  list.forEach(({t,j})=>{const s=gDate(j,t.tm),e=new Date(s.getTime()+(t.du||30)*60000);
    L.push('BEGIN:VEVENT',`UID:${t.id}@lifeplanner`,`DTSTAMP:${st}`,`DTSTART:${f(s)}`,`DTEND:${f(e)}`,`SUMMARY:${ic(t.x)}`);if(t.nt)L.push(`DESCRIPTION:${ic(t.nt)}`);
    if(hasRem(t)||true)L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${ic(t.x)}`,`TRIGGER:-PT${hasRem(t)?Math.min(+t.rm,40320):0}M`,'END:VALARM');
    L.push('END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n');
}

function monthExt(y,m){
  const ms=monthStats(y,m),md=mget(y,m),len=mlen(y,m),byTc={},pri={hi:[0,0],lo:[0,0]},focusD=[],doneD=[],spendD=Array(len).fill(0),scoreD=[];let plan=0,doneMin=0,focus=0;
  for(let d=1;d<=len;d++){const day=md.days[d]||EMPTY_DAY,fm=focusMin(day);let dn=0;focus+=fm;focusD.push(fm);
    (day.t||[]).forEach(tk=>{const k=tk.tc||'-';(byTc[k]=byTc[k]||[0,0]);byTc[k][1]++;const pp=tk.imp?pri.hi:pri.lo;pp[1]++;if(tk.done){byTc[k][0]++;pp[0]++;dn++;doneMin+=tk.du||0}plan+=tk.du||0});doneD.push(dn);scoreD.push(discScore(day))}
  const byPay={},payCnt={};md.exp.forEach(e=>{const p=e.p||'نامشخص';byPay[p]=(byPay[p]||0)+e.a;payCnt[p]=(payCnt[p]||0)+1;spendD[e.d-1]=(spendD[e.d-1]||0)+e.a});
  return Object.assign(ms,{byTc,pri,plan,doneMin,focus,focusD,doneD,spendD,scoreD,byPay,payCnt});
}
function yearStats(y){
  const M=[];for(let m=1;m<=12;m++)M.push(monthExt(y,m));const sum=f=>M.reduce((a,x)=>a+f(x),0),act=M.filter(x=>x.active),byCat={},byPay={},payCnt={},byTc={},hab={};
  M.forEach(x=>{x.cats.forEach(c=>byCat[c.id]=(byCat[c.id]||0)+c.v);for(const p in x.byPay){byPay[p]=(byPay[p]||0)+x.byPay[p];payCnt[p]=(payCnt[p]||0)+x.payCnt[p]}
    for(const k in x.byTc){(byTc[k]=byTc[k]||[0,0]);byTc[k][0]+=x.byTc[k][0];byTc[k][1]+=x.byTc[k][1]}
    x.habits.forEach(h=>{const a=hab[h.h.id]=hab[h.h.id]||{h:h.h,n:0,d:0};a.n+=h.n;a.d+=x.upto})});
  return{y,M,avg:act.length?Math.round(avg(act.map(x=>x.avg))):0,td:sum(x=>x.td),tt:sum(x=>x.tt),focus:sum(x=>x.focus),inc:sum(x=>x.inc),exp:sum(x=>x.exp),ex:sum(x=>x.ex),active:sum(x=>x.active),plan:sum(x=>x.plan),
    byCat,byPay,payCnt,byTc,habits:Object.values(hab).map(a=>({h:a.h,pct:a.d?Math.round(a.n/a.d*100):0})).sort((a,b)=>b.pct-a.pct)};
}

   if(!same(j,S.ui.date))toast('به '+fullDate(j)+' اضافه شد ✅');else if(hasRem(o))toast('🔔 یادآور تنظیم شد')},
 taskSave:f=>{const o=readTask(f);if(!o.x){toast('عنوان را بنویس');return}if(o.rm!=null&&!o.tm){toast('برای یادآور، ساعت را مشخص کن');return}
   const j0=pk(f.dataset.date),id=f.dataset.id;
   if(!id){addTask(o,o.date||j0);closeModal();render();toast('کار اضافه شد ✅');return}
   const d0=dset(j0),t=d0.t.find(x=>x.id===id);if(!t){closeModal();return}
   Object.assign(t,{x:o.x,tm:o.tm,du:o.du,rm:o.rm,tc:o.tc,gl:o.gl,nt:o.nt,imp:o.imp});t.done=o.dn?1:0;if(hasRem(t)){t.rf=0;t.sz=0}
   if(o.date&&!same(o.date,j0)){d0.t=d0.t.filter(x=>x.id!==id);dset(o.date).t.push(t)}
   closeModal();render()},
 goalSave:f=>{const x=f.elements.x.value.trim();if(!x){toast('عنوان هدف را بنویس');return}const dl=f.elements.hasdl.checked?readDate(f,'gl'):null,id=f.dataset.g;
   if(id){const g=S.settings.goals.find(y=>y.id===id);if(g){g.n=x;g.e=f.elements.e.value.trim()||'🎯';g.dl=dl}}else S.settings.goals.push({id:'g'+uid(),e:f.elements.e.value.trim()||'🎯',n:x,dl,ms:[]});
   touch('settings');closeModal();render()},
 msAdd:f=>{const x=f.elements.x.value.trim();if(!x)return;const g=S.settings.goals.find(y=>y.id===f.dataset.g);if(g){(g.ms=g.ms||[]).push({id:uid(),x,done:0});touch('settings');render()}},
 expSave:f=>{const{y,m}=S.ui.month,md=mset(y,m),e=md.exp.find(x=>x.id===f.dataset.id),a=num(f.elements.a.value);if(!e)return;if(a<=0){toast('مبلغ را وارد کن');return}
   Object.assign(e,{d:+f.elements.d.value,a,c:f.elements.c.value,p:f.elements.p.value,x:f.elements.x.value.trim()});closeModal();render()},
 payAdd:f=>{const x=f.elements.x.value.trim();if(!x||S.settings.pays.includes(x))return;S.settings.pays.push(x);touch('settings');render()},
 cardAdd:f=>{const bank=f.elements.bank.value.trim(),last4=f.elements.last4.value.replace(/\D/g,'').slice(-4),nick=f.elements.nick.value.trim();
   if(!bank){toast('نام بانک را بنویس');return}if(last4.length!==4){toast('۴ رقم آخر کارت را کامل بنویس');return}
   S.settings.cards.push({id:'c'+uid(),bank,last4,nick,color:PAL[S.settings.cards.length%PAL.length]});touch('settings');render()},
 tcAdd:f=>{const x=f.elements.x.value.trim();if(!x)return;S.settings.tcats.push({id:'t'+uid(),e:f.elements.e.value.trim()||'📌',n:x,c:PAL[S.settings.tcats.length%PAL.length]});touch('settings');render()},
 expAdd:f=>{if(f.elements.p&&f.elements.p.value)S.ui.lastPay=f.elements.p.value;_expAdd(f)}
});

/* ---------- اندروید: آلارم‌های سیستم ---------- */
function nativeItems(){
  const out=[],now=Date.now(),t0=todayJ();
  for(let i=-1;i<=30;i++){const j=addDays(t0,i);(dget(j).t||[]).forEach(t=>{
    if(t.done||!t.tm||!hasRem(t))return;
    let tr=gDate(j,t.tm).getTime()-(+t.rm)*60000;if(t.sz&&t.sz>tr)tr=t.sz;
    if(tr<=now)return;out.push({id:t.id,title:'⏰ '+t.x,body:fullDate(j)+' — ساعت '+fa(t.tm),at:tr})})}
  if(TM.run&&TM.end>now)out.push({id:'timer',title:TM.mode==='f'?'🎯 جلسه‌ی تمرکز تمام شد':'☕ استراحت تمام شد',body:'وقت '+(TM.mode==='f'?'استراحت':'تمرکز')+' است',at:TM.end});
  return out.sort((a,b)=>a.at-b.at).slice(0,80);
}
let _syT=0,_syLast='';
function syncNative(now){
  if(!window.Android||!Android.syncReminders)return;
  const go=()=>{try{const j=JSON.stringify(nativeItems());if(j!==_syLast){Android.syncReminders(j);_syLast=j}}catch(e){}};
  clearTimeout(_syT);if(now)go();else _syT=setTimeout(go,600);
}
Object.assign(ACT,{
 nativePerm:()=>{try{Android.requestPermissions()}catch(e){}},
 nativeBattery:()=>{try{Android.openBatterySettings()}catch(e){}},
 notifTest:()=>{if(window.Android){try{Android.scheduleReminder('test','⏰ آزمایش یادآور','اگر این اعلان را می‌بینی، یادآورها کار می‌کنند.',Date.now()+5000);toast('تا ۵ ثانیه‌ی دیگر اعلان می‌آید؛ می‌توانی برنامه را ببندی')}catch(e){toast('آزمایش ناموفق بود')}}else{beep(2);notify('⏰ آزمایش یادآور','اعلان کار می‌کند.','test');toast('آزمایش ارسال شد')}}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)syncNative(true)});
